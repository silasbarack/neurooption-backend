name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurooption_test
          POSTGRES_PASSWORD: local_ci_test_password
          POSTGRES_DB: neurooption_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neurooption_test -d neurooption_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://neurooption_test:local_ci_test_password@localhost:5432/neurooption_test
      JWT_SECRET: local_ci_jwt_secret
      RUN_PG_CONCURRENCY_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Typecheck & Lint
        run: npm run ci
      - name: Run tests
        if: always()
        run: npm test
      - name: Build production bundle
        if: always()
        run: npm run build
