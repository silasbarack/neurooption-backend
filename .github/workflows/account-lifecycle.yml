name: Account lifecycle

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurooption_test
          POSTGRES_PASSWORD: local_ci_test_password
          POSTGRES_DB: neurooption_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurooption_test -d neurooption_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neurooption_test:local_ci_test_password@localhost:5432/neurooption_test
      JWT_SECRET: local_ci_jwt_secret
      RUN_PG_CONCURRENCY_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Verify migration matches schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run build
      - name: Lint changed application code
        run: npx eslint src/auth/auth.service.ts src/auth/auth.module.ts src/auth/jwt.strategy.ts src/auth/authenticated-request.ts src/users/users.service.ts src/users/users.controller.ts src/users/public-user.ts src/users/dto/delete-account.dto.ts src/profile/profile.service.ts src/profile/profile.controller.ts src/common/lock-active-user.ts src/common/serializable-transaction.ts src/emails/emails.service.ts src/emails/emails.module.ts src/emails/email-outbox.service.ts src/deposits/deposits.service.ts src/ledger/ledger.service.ts src/affiliates/affiliates.service.ts src/social-trading/social-trading.service.ts
      - name: Run full suite against real PostgreSQL and local SMTP
        run: npm test
